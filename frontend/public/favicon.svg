<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Campus Customs tab mark: the same navy badge and CC monogram as the
       brand mark in the nav bar. Replaces the default Vite logo, which was
       still here and showed a purple lightning bolt on a Yale apparel shop. -->
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d4a72"/>
      <stop offset="1" stop-color="#0f2340"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#navy)"/>
  <text x="32" y="43"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="700" letter-spacing="-1"
        text-anchor="middle" fill="#fffdf9">CC</text>
  <rect x="14" y="49.5" width="36" height="2.5" rx="1.25" fill="#b4883b"/>
</svg>
